<style>
:root{
  --bg:#111113;
  --bg2:#1b1c1f;
  --white:#ffffff;
  --blue:#0322ef;
  --blue-soft:#3a4cff;
  --dim:#9a9ba3;
  --glass:rgba(255,255,255,0.05);
  --glass-border:rgba(255,255,255,0.13);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;min-height:100%;
  background:var(--bg);
  color:var(--white);
  font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;position:relative;padding:32px 16px;
}


.splash{
  position:fixed;inset:0;z-index:50;background:rgba(5,6,10,0.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .8s ease, visibility .8s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo{width:min(72vw,280px);height:auto;opacity:0;transform:scale(.7);animation:logoIn .8s ease forwards .15s;position:relative;z-index:1;}
@keyframes logoIn{to{opacity:1;transform:scale(1);}}
.splash-sub{
  font-family:'Inter',sans-serif;font-weight:300;font-size:12px;letter-spacing:.35em;
  color:var(--dim);position:relative;z-index:1;padding-left:.35em;
  opacity:0;transition:opacity .6s ease;
}
.splash-sub.show{opacity:1;}
.splash-status{
  position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));
  text-align:center;font-family:'Inter',sans-serif;font-weight:400;font-size:11px;
  letter-spacing:.08em;color:var(--dim);opacity:0;transition:opacity .3s ease;
  z-index:1;
}
.splash-status.show{opacity:.8;}

.liquid-wrap{position:fixed;inset:0;z-index:0;filter:url(#goo);overflow:hidden;}
.blob{position:absolute;border-radius:50%;animation:float linear infinite;}
.blob.blue{background:radial-gradient(circle at 35% 30%, var(--blue-soft), var(--blue) 60%, transparent 80%);}
.blob.grey{background:radial-gradient(circle at 35% 30%, #3a3b41, #232428 60%, transparent 80%);}
@keyframes float{
  0%{transform:translate(0,0) scale(1);}
  25%{transform:translate(var(--x1),var(--y1)) scale(var(--s1));}
  50%{transform:translate(var(--x2),var(--y2)) scale(var(--s2));}
  75%{transform:translate(var(--x3),var(--y3)) scale(var(--s3));}
  100%{transform:translate(0,0) scale(1);}
}
@media (prefers-reduced-motion: reduce){ .blob{animation:none;} }

.card{
  position:relative;z-index:1;width:100%;max-width:440px;
  background:linear-gradient(155deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  border:1px solid var(--glass-border);border-radius:26px;
  padding:26px 24px 22px;
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.65), 0 1px 0 rgba(255,255,255,0.12) inset;
  opacity:0;transform:translateY(26px);
  transition:opacity .8s ease, transform .8s cubic-bezier(.19,1,.22,1);
}
.card.show{opacity:1;transform:translateY(0);}

.top-row{display:flex;justify-content:flex-end;align-items:center;margin-bottom:18px;}

.ouce-toggle{
  position:absolute;top:26px;left:24px;transform:translateX(0);
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.03em;
  color:var(--dim);background:var(--glass);border:1px solid var(--glass-border);
  padding:5px 10px;border-radius:100px;cursor:pointer;z-index:3;
  transition:left .5s cubic-bezier(.19,1,.22,1), transform .5s cubic-bezier(.19,1,.22,1), opacity .2s, background .2s, font-size .3s;
}
.ouce-toggle:hover{background:rgba(255,255,255,0.12);}
.ouce-toggle:active{transform:translateX(0) scale(.96);}
.ouce-toggle.disabled{opacity:.4;cursor:not-allowed;}
.card.record-mode .ouce-toggle{left:50%;transform:translateX(-50%);font-size:13px;}
.card.record-mode .ouce-toggle:active{transform:translateX(-50%) scale(.96);}
.card.record-mode .ctrl-btn.settings,
.card.record-mode #muteBtn{display:none;}
.card.record-mode .controls{justify-content:center;}

.auth-widget{
  position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));
  z-index:12;opacity:0;transform:translateY(-10px);pointer-events:none;
  transition:opacity .8s ease, transform .8s cubic-bezier(.19,1,.22,1);
}
.auth-widget.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.auth-widget.rm-hidden{opacity:0 !important;transform:translateY(-10px) !important;pointer-events:none !important;}

#authButtons{display:flex;align-items:center;gap:14px;}
.auth-btn{
  display:flex;align-items:center;gap:6px;
  font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12.5px;
  color:var(--dim);background:none;border:none;padding:4px 2px;cursor:pointer;
  transition:color .2s;
}
.auth-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;flex-shrink:0;}
.auth-btn:hover{color:var(--white);}
.auth-btn.primary{
  color:var(--white);font-weight:600;
  background:var(--blue);padding:8px 16px;border-radius:9px;
  box-shadow:0 4px 14px -5px rgba(3,34,239,0.6);
}
.auth-btn.primary:hover{background:var(--blue-soft);box-shadow:0 6px 18px -4px rgba(3,34,239,0.75);color:var(--white);}

.auth-form,.user-dropdown{
  position:absolute;top:calc(100% + 14px);left:0;z-index:6;width:268px;
  background:linear-gradient(155deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  border:1px solid var(--glass-border);border-radius:22px;padding:22px;
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 60px -18px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.14) inset, 0 0 34px -12px rgba(3,34,239,0.4);
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;
  transition:opacity .3s ease, transform .35s cubic-bezier(.19,1,.22,1);
}
.auth-form.open,.user-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}

.auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(255,255,255,0.04);padding:4px;border-radius:13px;}
.auth-tab{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;padding:9px;border-radius:10px;border:none;background:transparent;color:var(--dim);cursor:pointer;transition:background .25s,color .25s;}
.auth-tab.active{background:var(--blue);color:#fff;}

.auth-field{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:13px;padding:11px 13px;margin-bottom:12px;transition:border-color .25s,box-shadow .25s;}
.auth-field:focus-within{border-color:rgba(3,34,239,0.6);box-shadow:0 0 0 3px rgba(3,34,239,0.16);}
.auth-field svg{width:15px;height:15px;stroke:var(--dim);fill:none;flex-shrink:0;}
.auth-field input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;}
.auth-field input::placeholder{color:var(--dim);}

.auth-error{font-size:11px;color:#ff7a7a;min-height:14px;margin-bottom:4px;}
.auth-submit{
  width:100%;padding:12px;border-radius:13px;border:none;margin-top:6px;
  background:linear-gradient(155deg,var(--blue-soft),var(--blue));color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 12px 28px -8px rgba(3,34,239,0.7);
  transition:transform .15s, box-shadow .25s;
}
.auth-submit:hover{box-shadow:0 14px 34px -6px rgba(3,34,239,0.9);transform:translateY(-1px);}
.auth-submit:active{transform:scale(.98);}
.auth-hint{font-size:10px;color:var(--dim);margin-top:14px;text-align:center;letter-spacing:.02em;}

.user-chip{
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(155deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
  border:1px solid var(--glass-border);padding:6px 16px 6px 6px;border-radius:100px;
  backdrop-filter:blur(16px) saturate(160%);color:var(--white);font-size:12px;cursor:pointer;max-width:200px;
  box-shadow:0 6px 18px -8px rgba(0,0,0,0.6);transition:box-shadow .25s,border-color .25s;
}
.user-chip:hover{background:rgba(255,255,255,0.14);}
.user-avatar{
  width:27px;height:27px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(155deg,var(--blue-soft),var(--blue));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px -1px rgba(3,34,239,0.8);
}
.user-avatar svg{width:14px;height:14px;stroke:#fff;fill:none;}
.user-chip span{font-family:'Space Grotesk',sans-serif;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-chip .chev{margin-left:2px;transition:transform .3s;flex-shrink:0;stroke:var(--dim);}
.user-chip.open .chev{transform:rotate(180deg);}

.dropdown-section-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--white);margin:20px 0 8px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.08);}
.dropdown-section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.dropdown-item{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:9px 4px 9px 13px;cursor:pointer;color:var(--white);transition:color .2s;}
.dropdown-item::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:transparent;transition:background .2s;}
.dropdown-item:hover{color:var(--blue-soft);}
.dropdown-item:hover::before{background:var(--blue-soft);}
.dropdown-item .count{color:var(--dim);font-size:10px;}

.dropdown-action{display:flex;align-items:center;gap:7px;width:100%;text-align:left;font-family:'Inter',sans-serif;font-size:12px;color:var(--blue-soft);background:none;border:none;padding:8px 4px;cursor:pointer;transition:color .2s;}
.dropdown-action svg{width:13px;height:13px;stroke:currentColor;fill:none;flex-shrink:0;}
.dropdown-action:hover{color:var(--white);}
.dropdown-action.logout{color:#ff8a8a;margin-top:10px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;}
.dropdown-action.logout:hover{color:#ffb3b3;}

.playlist-tracks{padding-left:10px;margin-bottom:6px;}
.track-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);padding:6px 4px;}
.track-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:'Inter',sans-serif;}
.track-row button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;padding:3px 7px;border-radius:7px;transition:background .2s,color .2s;}
.track-row button:hover{background:rgba(255,255,255,0.08);color:var(--white);}
.empty-list{font-size:11px;color:var(--dim);padding:8px 4px;font-style:italic;}

.collapse{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.19,1,.22,1), opacity .35s ease;}
.collapse.open{grid-template-rows:1fr;opacity:1;}
.collapse-inner{overflow:hidden;min-height:0;}


.upload-btn{display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:12px;color:var(--white);background:rgba(3,34,239,0.18);border:1px solid rgba(3,34,239,0.5);padding:6px 12px;border-radius:100px;cursor:pointer;transition:background .2s;}
.upload-btn:hover{background:rgba(3,34,239,0.32);}
.upload-btn svg{width:14px;height:14px;}
input[type=file]{display:none;}

h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:25px;margin:36px 0 2px;outline:none;cursor:text;border-radius:8px;padding:2px 4px;transition:background .2s;}
h1:focus{background:rgba(255,255,255,0.06);}
.artist{color:var(--dim);font-size:13px;margin-bottom:18px;outline:none;cursor:text;border-radius:6px;padding:1px 3px;}
.artist:focus{background:rgba(255,255,255,0.06);}

.viz{width:100%;height:104px;margin-bottom:14px;display:block;border-radius:8px;}

.progress-bar{position:relative;height:6px;border-radius:100px;background:rgba(255,255,255,0.1);cursor:pointer;touch-action:none;}
.progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--blue),var(--blue-soft));border-radius:100px;}
.progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums;}

.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 6px;}
.ctrl-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s;}
.ctrl-btn svg{width:18px;height:18px;stroke:var(--white);fill:none;}
.ctrl-btn:hover{background:rgba(255,255,255,0.12);}
.ctrl-btn:active{transform:scale(.92);}
.ctrl-btn.play{width:58px;height:58px;background:linear-gradient(160deg,var(--blue-soft),var(--blue));box-shadow:0 8px 24px -6px rgba(3,34,239,0.6);border:none;}
.ctrl-btn.play svg{width:20px;height:20px;fill:var(--white);stroke:none;}
.ctrl-btn.active{background:rgba(3,34,239,0.28);border-color:rgba(3,34,239,0.6);}

.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;}
.mini{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);}
.mini input[type=range]{-webkit-appearance:none;width:70px;height:3px;background:rgba(255,255,255,0.15);border-radius:10px;}
.mini input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--blue-soft);cursor:pointer;}

.empty-hint{font-size:12px;color:var(--dim);text-align:center;margin-top:4px;}

.settings-panel{max-height:0;overflow:hidden;opacity:0;margin-top:0;transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease;}
.settings-panel.open{max-height:140px;opacity:1;margin-top:14px;}
.settings-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);padding:7px 2px;}
.settings-row span:first-child{width:56px;color:var(--white);flex-shrink:0;}
.settings-row span:last-child{width:38px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;}
.settings-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,0.15);border-radius:10px;}
.settings-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--blue-soft);cursor:pointer;}
.settings-row select{flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--white);font-size:12px;font-family:'Inter',sans-serif;}
.settings-row select option{background:#1b1c1f;color:var(--white);}
.ctrl-btn.settings.active{background:rgba(3,34,239,0.28);border-color:rgba(3,34,239,0.6);}

.download-btn{
  display:none;width:100%;margin-top:12px;padding:11px;border-radius:14px;border:none;
  background:linear-gradient(160deg,var(--blue-soft),var(--blue));color:#fff;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 10px 24px -8px rgba(3,34,239,0.55);transition:opacity .2s,transform .15s;
}
.download-btn.show{display:block;}
.download-btn:active{transform:scale(.98);}
.download-btn:disabled{opacity:.6;cursor:wait;}

.sig{
  position:fixed;right:18px;bottom:18px;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(14px);
  animation:sigIn .6s ease forwards 3.7s;
  z-index:2;
}
.sig .by{font-family:'Inter',sans-serif;font-size:12px;color:var(--white);opacity:.85;}
.sig-img{height:34px;width:auto;display:block;filter:brightness(0) invert(1);}
@keyframes sigIn{to{opacity:1;transform:translateY(0);}}
@keyframes sigPulse{0%,100%{box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);}50%{box-shadow:0 10px 34px -6px rgba(3,34,239,0.5);}}
</style>

(function(){
  const sub=document.getElementById('splashSub');
  const status=document.getElementById('splashStatus');
  const messages=['Renderizando painel…','Ajustando controles…','Criando coisas…','Afinando os detalhes…'];

    status.classList.remove('show');

      status.classList.add('show');
      mi++;

    document.getElementById('splash').classList.add('hide');
    document.querySelector('.card').classList.add('show');

  }

  setTimeout(()=>{ sub.classList.add('show'); }, 450);
  setTimeout(()=>{
    cycleStatus();
    statusTimer=setInterval(cycleStatus, 650);
  }, 650);
  setTimeout(finishSplash, 2900);
})();

// waveform canvas — live equalizer reacting to the actual playing audio, eased for smooth motion
const viz=document.getElementById('viz');
const vctx=viz.getContext('2d');
const BARS=56;
const smoothBars=new Float32Array(BARS).fill(6);
let bandBounds=null;
function resizeViz(){
  const rect=viz.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  viz.width=rect.width*dpr;
  viz.height=rect.height*dpr;
  vctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resizeViz);
requestAnimationFrame(resizeViz);

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

// group FFT bins logarithmically so bass doesn't dominate and treble bars still move
function computeBands(binCount){
  const bands=[];
  const minIndex=1, maxIndex=binCount-1;
  const logMin=Math.log2(minIndex), logMax=Math.log2(maxIndex);
  for(let i=0;i<BARS;i++){
    let idx0=Math.round(Math.pow(2, logMin+(logMax-logMin)*(i/BARS)));
    let idx1=Math.round(Math.pow(2, logMin+(logMax-logMin)*((i+1)/BARS)));
    idx0=Math.max(minIndex,idx0);
    idx1=Math.max(idx0+1,Math.min(maxIndex,idx1));
    bands.push([idx0,idx1]);
  }
  return bands;
}

function draw(){
  requestAnimationFrame(draw);
  const w=viz.clientWidth, h=viz.clientHeight;
  if(!w||!h) return;
  vctx.clearRect(0,0,w,h);
  const gap=3;
  const barW=(w-gap*(BARS-1))/BARS;
  const grad=vctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(1,'#3a4cff');
  const playing = analyser && !audio.paused;
  if(playing){ analyser.getByteFrequencyData(dataArray); if(!bandBounds) bandBounds=computeBands(dataArray.length); }
  for(let i=0;i<BARS;i++){
    let targetH=6;
    if(playing && bandBounds){
      const [s,e]=bandBounds[i];
      let peak=0;
      for(let k=s;k<e;k++){ if(dataArray[k]>peak) peak=dataArray[k]; }
      const tilt=0.9+(i/(BARS-1))*0.55; // mild boost for treble bars
      targetH = 6 + Math.min(1, (peak/255)*tilt)*82; // true-to-volume, no artificial lift on quiet audio
    }
    smoothBars[i] += (targetH-smoothBars[i])*0.16; // eased so it flows instead of flashing
    const barH=(smoothBars[i]/100)*h;
    const x=i*(barW+gap);
    const y=h-barH;
    vctx.fillStyle=grad;
    roundRect(vctx,x,y,barW,barH,barW/2.4);
    vctx.fill();
  }
}

  authForm.classList.add('open');
  setAuthMode(mode);
  setTimeout(()=>authEmail.focus(), 50);
}
showLoginBtn.addEventListener('click', ()=>openAuthForm('login'));
showSignupBtn.addEventListener('click', ()=>openAuthForm('signup'));
tabLogin.addEventListener('click', ()=>setAuthMode('login'));
tabSignup.addEventListener('click', ()=>setAuthMode('signup'));

authSubmit.addEventListener('click', async ()=>{
  const email=authEmail.value.trim().toLowerCase();
  const pass=authPass.value;
  if(!email || !email.includes('@')){ authError.textContent='Email inválido.'; return; }
  if(!pass || pass.length<6){ authError.textContent='Senha muito curta (mín. 6).'; return; }
  authSubmit.disabled=true;
  const original=authSubmit.textContent;
  authSubmit.textContent='Um instante…';
  let result;
  if(authMode==='signup'){
    result=await sb.auth.signUp({email, password:pass});
  } else {
    result=await sb.auth.signInWithPassword({email, password:pass});
  }
  authSubmit.disabled=false;
  authSubmit.textContent=original;
  if(result.error){ authError.textContent=result.error.message; return; }
  if(authMode==='signup' && !result.data.session){
    authError.textContent='Conta criada! Confirme seu email antes de entrar.';
    return;
  }
  authEmail.value=''; authPass.value='';
  // enterLoggedInState runs automatically via onAuthStateChange below
});

async function enterLoggedInState(email){
  currentUser=email;
  authButtons.style.display='none';
  authForm.classList.remove('open');
  userChipWrap.style.display='';
  userEmailLabel.textContent=email;
  addToPlaylistRow.style.display = currentFile ? 'flex' : 'none';
  await refreshPlaylists();
  await refreshHistory();
}
function exitLoggedInState(){
  currentUser=null;
  userChipWrap.style.display='none';
  userDropdown.classList.remove('open');
  userChip.classList.remove('open');
  addToPlaylistRow.style.display='none';
  authButtons.style.display='';
}

sb.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){ enterLoggedInState(session.user.email); }
  else { exitLoggedInState(); }
});

userChip.addEventListener('click', ()=>{
  userDropdown.classList.toggle('open');
  userChip.classList.toggle('open');
});
logoutBtn.addEventListener('click', ()=>sb.auth.signOut());

document.addEventListener('click', e=>{
  if(!authWidget.contains(e.target)){
    authForm.classList.remove('open');
    if(!currentUser) authButtons.style.display='';
    userDropdown.classList.remove('open');
    userChip.classList.remove('open');
  }
});

let historyCache=[];

async function refreshPlaylists(){
  if(!currentUser) return;
  const {data:lists, error}=await sb.from('playlists').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); return; }
  playlistList.innerHTML='';
  addToPlaylistSelect.innerHTML='<option value="">Adicionar em...</option>';
  if(!lists.length){ playlistList.innerHTML='<div class="empty-list">Nenhuma playlist ainda.</div>'; }
  lists.forEach(pl=>{
    const row=document.createElement('div');
    row.className='dropdown-item';
    const n=(pl.track_ids||[]).length;
    row.innerHTML=`<span>${pl.name}</span><span class="count">${n} faixa${n!==1?'s':''}</span>`;
    row.addEventListener('click', ()=>togglePlaylistTracks(row, pl));
    playlistList.appendChild(row);
    const opt=document.createElement('option');
    opt.value=pl.id; opt.textContent=pl.name;
    addToPlaylistSelect.appendChild(opt);
  });
  const newOpt=document.createElement('option');
  newOpt.value='__new__'; newOpt.textContent='+ Criar nova playlist';
  addToPlaylistSelect.appendChild(newOpt);
}

function togglePlaylistTracks(row, pl){
  const existing=row.nextElementSibling;
  if(existing && existing.classList.contains('playlist-tracks')){ existing.remove(); return; }
  const wrap=document.createElement('div');
  wrap.className='playlist-tracks';
  const ids=pl.track_ids||[];
  if(!ids.length){ wrap.innerHTML='<div class="empty-list">Vazia.</div>'; }
  ids.forEach(hid=>{
    const h=historyCache.find(x=>x.id===hid);
    const tr=document.createElement('div');
    tr.className='track-row';
    tr.innerHTML=`<span>${h?h.title:'(removida)'}</span><button title="Tocar">▶</button><button title="Remover">×</button>`;
    const [playBtnEl,removeBtnEl]=tr.querySelectorAll('button');
    playBtnEl.addEventListener('click', async ev=>{ ev.stopPropagation(); if(h) await loadTrackIntoPlayer(h); });
    removeBtnEl.addEventListener('click', async ev=>{
      ev.stopPropagation();
      const newIds=ids.filter(x=>x!==hid);
      await sb.from('playlists').update({track_ids:newIds}).eq('id', pl.id);
      pl.track_ids=newIds;
      refreshPlaylists();
    });
    wrap.appendChild(tr);
  });
  row.after(wrap);
}

newPlaylistBtn.addEventListener('click', async ()=>{
  const name=prompt('Nome da playlist:');
  if(!name) return;
  await sb.from('playlists').insert({name, track_ids:[]});
  refreshPlaylists();
});

addToPlaylistSelect.addEventListener('change', async ()=>{
  const val=addToPlaylistSelect.value;
  if(!val || !currentHistoryId) { addToPlaylistSelect.value=''; return; }
  let playlistId=val;
  if(val==='__new__'){
    const name=prompt('Nome da nova playlist:');
    if(!name){ addToPlaylistSelect.value=''; return; }
    const {data}=await sb.from('playlists').insert({name, track_ids:[currentHistoryId]}).select().single();
    playlistId=data.id;
  } else {
    const {data:pl}=await sb.from('playlists').select('track_ids').eq('id', val).single();
    const ids=[...(pl.track_ids||[]), currentHistoryId];
    await sb.from('playlists').update({track_ids:ids}).eq('id', val);
  }
  await refreshPlaylists();
  const original=addToPlaylistSelect.options[0].textContent;
  addToPlaylistSelect.options[0].textContent='Adicionado ✓';
  setTimeout(()=>{ addToPlaylistSelect.options[0].textContent=original; addToPlaylistSelect.value=''; },1200);
});

async function refreshHistory(){
  if(!currentUser) return;
  const {data:items, error}=await sb.from('history').select('*').order('created_at',{ascending:false}).limit(30);
  if(error){ console.error(error); return; }
  historyCache=items;
  historyList.innerHTML='';
  if(!items.length){ historyList.innerHTML='<div class="empty-list">Nada no histórico ainda.</div>'; return; }
  items.forEach(item=>{
    const row=document.createElement('div');
    row.className='dropdown-item';
    row.innerHTML=`<span>${item.title}</span>`;
    row.addEventListener('click', ()=>loadTrackIntoPlayer(item));
    historyList.appendChild(row);
  });
}

async function loadTrackIntoPlayer(item){
  const {data:blob, error}=await sb.storage.from('audio').download(item.storage_path);
  if(error){ alert('Não consegui baixar esse áudio.'); return; }
  currentFile=blob;
  currentHistoryId=item.id;
  const url=URL.createObjectURL(blob);
  audio.src=url;
  hint.style.display='none';
  document.getElementById('title').textContent=item.title;
  document.getElementById('artist').textContent=item.artist||'';
  setupAnalyser();
  audio.play().catch(()=>{});
  tagBtn.classList.remove('disabled');
  const s=item.settings||{};
  slowedRange.value=s.slowed||0; slowedRange.dispatchEvent(new Event('input'));
  speedupRange.value=s.speedup||0; speedupRange.dispatchEvent(new Event('input'));
  reverbRange.value=s.reverb||0; reverbRange.dispatchEvent(new Event('input'));
  if(currentUser) addToPlaylistRow.style.display='flex';
  userDropdown.classList.remove('open'); userChip.classList.remove('open');
}

async function saveToHistory(){
  if(!currentUser || !currentFile) return;
  const title=document.getElementById('title').textContent;
  const artist=document.getElementById('artist').textContent;
  const settings={slowed:slowedRange.value, speedup:speedupRange.value, reverb:reverbRange.value};

  if(currentHistoryId){
    await sb.from('history').update({title, artist, settings}).eq('id', currentHistoryId);
    refreshHistory();
    return;
  }
  const {data:{user}}=await sb.auth.getUser();
  const path=`${user.id}/${Date.now()}-${(currentFile.name||'audio').replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const {error:upErr}=await sb.storage.from('audio').upload(path, currentFile);
  if(upErr){ console.error(upErr); return; }
  const {data, error}=await sb.from('history').insert({title, artist, storage_path:path, settings}).select().single();
  if(error){ console.error(error); return; }
  currentHistoryId=data.id;
  refreshHistory();
}

// restore session on load (Supabase persists it in localStorage automatically)
(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(session && session.user) enterLoggedInState(session.user.email);
})();

let audioCtx, source, analyser, dataArray, dryGain, wetGain, convolver;
function fmt(t){ if(!isFinite(t))return '00:00'; const m=Math.floor(t/60),s=Math.floor(t%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

function makeReverbBuffer(ctx, seconds, decay){
  const rate=ctx.sampleRate;
  const length=Math.floor(rate*seconds);
  const buf=ctx.createBuffer(2,length,rate);
  for(let ch=0;ch<2;ch++){
    const data=buf.getChannelData(ch);
    for(let i=0;i<length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay); }
  }
  return buf;
}

function setupAnalyser(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  dryGain = audioCtx.createGain(); dryGain.gain.value=1;
  wetGain = audioCtx.createGain(); wetGain.gain.value=0;
  convolver = audioCtx.createConvolver();
  convolver.buffer = makeReverbBuffer(audioCtx, 2.8, 3.2);
  source.connect(analyser);
  analyser.connect(dryGain);
  analyser.connect(convolver);
  convolver.connect(wetGain);
  dryGain.connect(audioCtx.destination);
  wetGain.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

settingsBtn.addEventListener('click', ()=>{
  setupAnalyser();
  settingsPanel.classList.toggle('open');
  settingsBtn.classList.toggle('active');
});

function updateDownloadBtn(){
  const modified = parseFloat(slowedRange.value)>0 || parseFloat(speedupRange.value)>0 || parseFloat(reverbRange.value)>0;
  downloadBtn.classList.toggle('show', modified && !!currentFile);
}

let historySaveTimer=null;
function queueHistorySave(){
  if(!currentUser || !currentFile) return;
  clearTimeout(historySaveTimer);
  historySaveTimer=setTimeout(saveToHistory, 900);
}

slowedRange.addEventListener('input', ()=>{
  const t=parseFloat(slowedRange.value);
  slowedVal.textContent=Math.round(t*100)+'%';
  if(t>0 && parseFloat(speedupRange.value)>0){ speedupRange.value=0; speedupVal.textContent='0%'; }
  audio.playbackRate = 1 - t*0.5;
  const drop = t>0.02;
  audio.preservesPitch=!drop; audio.mozPreservesPitch=!drop; audio.webkitPreservesPitch=!drop;
  updateDownloadBtn();
  queueHistorySave();
});

speedupRange.addEventListener('input', ()=>{
  const t=parseFloat(speedupRange.value);
  speedupVal.textContent=Math.round(t*100)+'%';
  if(t>0 && parseFloat(slowedRange.value)>0){ slowedRange.value=0; slowedVal.textContent='0%'; }
  audio.playbackRate = 1 + t*0.8;
  const raise = t>0.02;
  audio.preservesPitch=!raise; audio.mozPreservesPitch=!raise; audio.webkitPreservesPitch=!raise;
  updateDownloadBtn();
  queueHistorySave();
});

reverbRange.addEventListener('input', ()=>{
  setupAnalyser();
  const t=parseFloat(reverbRange.value);
  reverbVal.textContent=Math.round(t*100)+'%';
  wetGain.gain.setTargetAtTime(t*0.6, audioCtx.currentTime, 0.2);
  dryGain.gain.setTargetAtTime(1 - t*0.25, audioCtx.currentTime, 0.2);
  updateDownloadBtn();
  queueHistorySave();
});

document.getElementById('title').addEventListener('blur', queueHistorySave);
document.getElementById('artist').addEventListener('blur', queueHistorySave);

fileInput.addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;
  currentFile=f;
  currentHistoryId=null;
  const url=URL.createObjectURL(f);
  audio.src=url;
  hint.style.display='none';
  const name=f.name.replace(/\.[^/.]+$/,'');
  document.getElementById('title').textContent=name;
  setupAnalyser();
  audio.play().catch(()=>{});
  updateDownloadBtn();
  tagBtn.classList.remove('disabled');
  if(currentUser){ addToPlaylistRow.style.display='flex'; saveToHistory(); }
});

playBtn.addEventListener('click',()=>{
  if(!audio.src){ fileInput.click(); return; }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  if(audio.paused){ audio.play(); } else { audio.pause(); }
});
audio.addEventListener('play',()=>{ playIcon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; });
audio.addEventListener('pause',()=>{ playIcon.innerHTML='<polygon points="6,4 20,12 6,20"/>'; });

muteBtn.addEventListener('click',()=>{
  audio.muted=!audio.muted;
  muteBtn.classList.toggle('active',audio.muted);
});

vol.addEventListener('input',()=>{ audio.volume=vol.value; });

audio.addEventListener('loadedmetadata',()=>{ durTime.textContent=fmt(audio.duration); });
audio.addEventListener('timeupdate',()=>{
  curTime.textContent=fmt(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  progressFill.style.width=pct+'%';
});
function scrubTo(clientX){
  if(!audio.duration) return;
  const r=progressBar.getBoundingClientRect();
  const frac=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  audio.currentTime=frac*audio.duration;
  progressFill.style.width=(frac*100)+'%';
  curTime.textContent=fmt(audio.currentTime);
}
let dragging=false;
progressBar.addEventListener('pointerdown',e=>{
  dragging=true;
  progressBar.setPointerCapture(e.pointerId);
  scrubTo(e.clientX);
});
progressBar.addEventListener('pointermove',e=>{
  if(dragging) scrubTo(e.clientX);
});
progressBar.addEventListener('pointerup',e=>{
  dragging=false;
});
progressBar.addEventListener('pointercancel',()=>{ dragging=false; });

function audioBufferToWav(buffer){
  const numCh=buffer.numberOfChannels, len=buffer.length, sr=buffer.sampleRate;
  const bytesPerSample=2, blockAlign=numCh*bytesPerSample;
  const dataSize=len*blockAlign;
  const bufOut=new ArrayBuffer(44+dataSize);
  const view=new DataView(bufOut);
  const writeStr=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4,36+dataSize,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sr,true);
  view.setUint32(28,sr*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40,dataSize,true);
  const chans=[]; for(let c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
  let off=44;
  for(let i=0;i<len;i++){
    for(let c=0;c<numCh;c++){
      let s=Math.max(-1,Math.min(1,chans[c][i]));
      view.setInt16(off, s<0? s*0x8000 : s*0x7fff, true);
      off+=2;
    }
  }
  return new Blob([bufOut],{type:'audio/wav'});
}

downloadBtn.addEventListener('click', async ()=>{
  if(!currentFile || downloadBtn.disabled) return;
  downloadBtn.disabled=true;
  const original=downloadBtn.textContent;
  downloadBtn.textContent='Preparando…';
  try{
    const arrBuf=await currentFile.arrayBuffer();
    const decodeCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const original_buf=await decodeCtx.decodeAudioData(arrBuf);

    const st=parseFloat(slowedRange.value), sp=parseFloat(speedupRange.value), rv=parseFloat(reverbRange.value);
    const rate = st>0 ? (1-st*0.5) : (sp>0 ? (1+sp*0.8) : 1);
    const outLength=Math.max(1,Math.ceil(original_buf.length/rate));
    const offlineCtx=new OfflineAudioContext(original_buf.numberOfChannels, outLength, original_buf.sampleRate);

    const src=offlineCtx.createBufferSource();
    src.buffer=original_buf;
    src.playbackRate.value=rate;

    const dry=offlineCtx.createGain(); dry.gain.value=1-rv*0.25;
    const wet=offlineCtx.createGain(); wet.gain.value=rv*0.6;
    const convolver=offlineCtx.createConvolver();
    convolver.buffer=makeReverbBuffer(offlineCtx, 2.8, 3.2);

    src.connect(dry); dry.connect(offlineCtx.destination);
    src.connect(convolver); convolver.connect(wet); wet.connect(offlineCtx.destination);
    src.start(0);

    const rendered=await offlineCtx.startRendering();
    const wavBlob=audioBufferToWav(rendered);
    const url=URL.createObjectURL(wavBlob);
    const a=document.createElement('a');
    const name=(document.getElementById('title').textContent||'audio').trim() || 'audio';
    a.href=url; a.download=name+'.wav';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    alert('Não foi possível gerar o áudio modificado.');
  }finally{
    downloadBtn.disabled=false;
    downloadBtn.textContent=original;
  }
});

draw();
