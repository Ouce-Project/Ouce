<style>
:root{--blue:#3a4cff;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:#111;color:#fff;font-family:'Inter',system-ui,sans-serif;animation:appear .5s ease;}

.closed{
  min-height:100vh;min-height:100svh;padding:32px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.logo{width:min(70vw,240px);height:auto;margin-bottom:32px;}
.msg{margin:0 0 32px;max-width:320px;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.75);text-wrap:balance;}
.bar{width:min(240px,70vw);height:3px;background:#2b2b2b;border-radius:2px;overflow:hidden;}
.fill{display:block;height:100%;width:0;background:var(--blue);animation:creep 3600s linear .3s forwards;}

@keyframes appear{from{opacity:0;}to{opacity:1;}}
/* sobe rápido no começo e vai desacelerando; para em 95%, nunca chega ao fim */
@keyframes creep{
  0%{width:0%;}
  0.3%{width:35%;}
  2%{width:60%;}
  10%{width:78%;}
  40%{width:88%;}
  100%{width:95%;}
}

@media (prefers-reduced-motion:reduce){
  body{animation:none;}
  .fill{animation:none;width:60%;}
}
</style>
